<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a3"/></marker></defs><rect width="900" height="270" fill="#ffffff"/><text x="450" y="34" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">组装顺序：先烧录归中，再装腿</text><rect x="18" y="90" width="110" height="90" rx="10" fill="#f1f3f5" stroke="#5b6472" stroke-width="2"/><text x="73.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">① 备料</text><text x="73.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">电子件 + 打印件</text><rect x="144" y="90" width="110" height="90" rx="10" fill="#f1f3f5" stroke="#5b6472" stroke-width="2"/><text x="199.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">② 焊板</text><text x="199.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">买成品板跳过</text><line x1="128" y1="135" x2="144" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="270" y="90" width="110" height="90" rx="10" fill="#fff0d6" stroke="#e08c02" stroke-width="2"/><text x="325.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">③ 烧录归中</text><text x="325.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">舵机转到 90°</text><line x1="254" y1="135" x2="270" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="396" y="90" width="110" height="90" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="451.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">④ 装腿脚</text><text x="451.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">摇臂对正</text><line x1="380" y1="135" x2="396" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="522" y="90" width="110" height="90" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="577.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑤ 装主板</text><text x="577.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">插回舵机线</text><line x1="506" y1="135" x2="522" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="648" y="90" width="110" height="90" rx="10" fill="#fff6cc" stroke="#f7c600" stroke-width="2"/><text x="703.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑥ 扣外壳</text><text x="703.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">奶龙 / 看山</text><line x1="632" y1="135" x2="648" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="774" y="90" width="110" height="90" rx="10" fill="#e2f5ea" stroke="#2e9e5b" stroke-width="2"/><text x="829.0" y="128.75" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑦ 自检</text><text x="829.0" y="150.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">站直、会动</text><line x1="758" y1="135" x2="774" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="225" font-size="13" font-weight="400" fill="#d64545" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">第 ③ 步必须在第 ④ 步之前：舵机没归中就装摇臂，走路会歪，甚至顶死</text></svg>