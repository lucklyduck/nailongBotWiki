<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a3"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">人设怎么让奶龙做动作</text><rect x="30" y="70" width="250" height="190" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="155.0" y="133.6" font-size="16" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">角色介绍（人设）</text><text x="155.0" y="155.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">我是奶龙……</text><text x="155.0" y="172.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">听不懂就大笑</text><text x="155.0" y="189.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">高兴时摇摆</text><text x="155.0" y="206.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">打招呼时跳一下</text><rect x="330" y="100" width="240" height="130" rx="10" fill="#fff0d6" stroke="#e08c02" stroke-width="2"/><text x="450.0" y="150.6" font-size="16" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">大模型</text><text x="450.0" y="172.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">读人设 + 你说的话</text><text x="450.0" y="189.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">决定说什么、做什么</text><rect x="620" y="70" width="250" height="190" rx="10" fill="#fff6cc" stroke="#f7c600" stroke-width="2"/><text x="745.0" y="133.6" font-size="16" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">机器人上的 MCP 工具</text><text x="745.0" y="155.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">self.otto.laugh</text><text x="745.0" y="172.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">self.otto.walk_forward</text><text x="745.0" y="189.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">self.otto.swing</text><text x="745.0" y="206.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">self.otto.jump …</text><line x1="280" y1="165" x2="330" y2="165" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="165" x2="620" y2="165" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="595.0" y="157.0" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">调用工具</text><text x="450" y="288" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">工具由固件在连接时自动上报，后台不需要手动添加；人设只负责告诉大模型什么时候用</text></svg>