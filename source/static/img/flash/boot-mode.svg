<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a3"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">进入下载模式（自动失败时才需要）</text><rect x="40" y="90" width="180" height="110" rx="10" fill="#f1f3f5" stroke="#5b6472" stroke-width="2"/><text x="130.0" y="130.6" font-size="16" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">电脑</text><text x="130.0" y="152.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Chrome / esptool</text><text x="130.0" y="169.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">/ idf.py</text><rect x="380" y="70" width="200" height="150" rx="10" fill="#fff6cc" stroke="#f7c600" stroke-width="2"/><text x="480.0" y="130.6" font-size="16" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">奶龙机器人</text><text x="480.0" y="152.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">电池已装</text><text x="480.0" y="169.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">电源开关：关</text><line x1="220" y1="145" x2="380" y2="145" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="300.0" y="137.0" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">USB-C 数据线</text><rect x="640" y="62" width="220" height="36" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="750.0" y="84.9" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">① 关机，插好数据线</text><rect x="640" y="106" width="220" height="36" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="750.0" y="128.9" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">② 按住 BOOT 键</text><rect x="640" y="150" width="220" height="36" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="750.0" y="172.9" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">③ 打开电源开关</text><rect x="640" y="194" width="220" height="36" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="750.0" y="216.9" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">④ 1 秒后松开 BOOT</text><rect x="640" y="238" width="220" height="36" rx="10" fill="#e2f5ea" stroke="#2e9e5b" stroke-width="2"/><text x="750.0" y="260.9" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑤ 开始烧录</text><text x="450" y="280" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">示意图。BOOT 键是主板上的贴片轻触按键（GPIO0）</text></svg>