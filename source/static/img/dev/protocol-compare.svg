ozhi.me</text><text x="815.0" y="269.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">或自建</text><line x1="574" y1="150" x2="756" y2="150" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arrs)"/><text x="665" y="140" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">文本帧：JSON 控制消息</text><line x1="574" y1="250" x2="756" y2="250" stroke="#d64545" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)" marker-start="url(#arrs)"/><text x="665" y="240" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">二进制帧：Opus 声音</text><line x1="574" y1="330" x2="756" y2="330" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arrs)"/><text x="665" y="320" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">同一条连接，wss 走 TLS</text><text x="450" y="440" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">实线 = 控制消息（JSON），虚线 = 声音（Opus，60 ms 一帧）</text></svg>