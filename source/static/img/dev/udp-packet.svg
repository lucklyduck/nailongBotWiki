ei, Noto Sans CJK SC, sans-serif">2 字节</text><rect x="270" y="70" width="150" height="70" rx="4" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="345.0" y="98.4" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">ssrc</text><text x="345.0" y="119.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4 字节</text><rect x="420" y="70" width="150" height="70" rx="4" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="495.0" y="98.4" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">timestamp</text><text x="495.0" y="119.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4 字节</text><rect x="570" y="70" width="150" height="70" rx="4" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="645.0" y="98.4" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">sequence</text><text x="645.0" y="119.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4 字节</text><rect x="720" y="70" width="140" height="70" rx="4" fill="#fff0d6" stroke="#e08c02" stroke-width="2"/><text x="790.0" y="98.4" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Opus 密文</text><text x="790.0" y="119.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">payload_len 字节</text><text x="450" y="175" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">服务器在 hello 里给出 key 和 nonce；设备每发一包，把长度、时间戳和自增序号写进 nonce 再加密</text><text x="450" y="200" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">接收端用同样的 16 字节解密，并检查 sequence 防止重放</text></svg>