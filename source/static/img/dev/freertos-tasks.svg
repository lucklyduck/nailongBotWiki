.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">sound_queue（1 个）</text><line x1="280" y1="135" x2="350" y2="175" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="315.0" y="147.0" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">置位</text><line x1="550" y1="175" x2="620" y2="135" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="585.0" y="147.0" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">唤醒</text><line x1="280" y1="265" x2="350" y2="195" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="315.0" y="222.0" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">编码好一包</text><line x1="660" y1="180" x2="520" y2="290" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="560" y="262" font-size="12" font-weight="400" fill="#5b6472" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">MCP 回调</text><line x1="550" y1="315" x2="620" y2="265" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><line x1="550" y1="340" x2="620" y2="390" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="384" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">xQueueReceive 取出</text><text x="450" y="480" font-size="13" font-weight="400" fill="#e08c02" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">规则：网络和状态只在 main_event_loop 里改；别的任务想动它们，就用 Schedule() 把一段代码排进主循环</text></svg>