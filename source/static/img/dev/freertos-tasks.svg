<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a3"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="34" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">奶龙固件里的主要 FreeRTOS 任务</text><text x="450" y="58" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">括号里是优先级，数字越大越优先；ESP32-S3 两个核都在跑任务</text><rect x="40" y="90" width="240" height="90" rx="10" fill="#fde8e8" stroke="#d64545" stroke-width="2"/><text x="160.0" y="120.25" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">audio_input (8)</text><text x="160.0" y="141.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">读麦克风 · 唤醒词 · VAD</text><text x="160.0" y="158.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">固定在 0 号核</text><rect x="40" y="220" width="240" height="90" rx="10" fill="#fff0d6" stroke="#e08c02" stroke-width="2"/><text x="160.0" y="250.25" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">opus_codec (2)</text><text x="160.0" y="271.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Opus 编码 / 解码</text><text x="160.0" y="288.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">栈 26 KB，最大的一个</text><rect x="40" y="350" width="240" height="90" rx="10" fill="#fde8e8" stroke="#d64545" stroke-width="2"/><text x="160.0" y="380.25" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">audio_output (4)</text><text x="160.0" y="401.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">解码后的声音</text><text x="160.0" y="418.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">送给功放</text><rect x="620" y="90" width="240" height="90" rx="10" fill="#fff6cc" stroke="#f7c600" stroke-width="2"/><text x="740.0" y="120.25" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">main_event_loop (3)</text><text x="740.0" y="141.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">等事件组 · 管状态机</text><text x="740.0" y="158.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">收发网络消息</text><rect x="620" y="220" width="240" height="90" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2"/><text x="740.0" y="250.25" font-size="15" font-weight="600" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">otto_action (3)</text><text x="740.0" y="271.5" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">从动作队列取动作</text><text x="740.