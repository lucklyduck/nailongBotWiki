<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450" y="34" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">装脚：专用摇臂垂直朝上，舵机线穿过腿进身体</text><rect x="60" y="200" width="220" height="60" rx="10" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2.5"/><path d="M160 200 l20 0 l-4 -80 l-12 0 z" fill="#f4f4f4" stroke="#5b6472" stroke-width="2"/><text x="170" y="290" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">① 脚摇臂竖直朝上装在脚上</text><line x1="300" y1="200" x2="380" y2="200" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="420" y="70" width="70" height="200" rx="10" fill="#ffffff" stroke="#5b6472" stroke-width="2.5"/><g transform="rotate(0 455.0 235.0)"><rect x="405" y="230.5" width="100" height="9.0" rx="2" fill="#2b6fc4"/><rect x="415" y="220" width="80" height="30" rx="4" fill="#3b82d6" stroke="#1f4f8f" stroke-width="1.5"/><circle cx="435.0" cy="215" r="7" fill="#f4f4f4" stroke="#5b6472" stroke-width="1.5"/><rect x="427.0" y="214" width="16.0" height="6" fill="#3b82d6"/></g><path d="M455 220 C 470 160, 440 120, 455 70" fill="none" stroke="#7a4a20" stroke-width="3"/><path d="M459 220 C 474 160, 444 120, 459 70" fill="none" stroke="#d64545" stroke-width="3"/><path d="M463 220 C 478 160, 448 120, 463 70" fill="none" stroke="#f0a020" stroke-width="3"/><text x="455" y="295" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">② 脚舵机装进腿下端，线往上穿</text><line x1="510" y1="200" x2="590" y2="200" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="690" y="70" width="70" height="170" rx="10" fill="#ffffff" stroke="#5b6472" stroke-width="2.5"/><rect x="640" y="236" width="170" height="40" rx="8" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2.5"/><text x="725" y="305" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">③ 脚套上舵机轴，拧固定螺丝</text><text x="450" y="324" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">示意图。脚平放时脚掌应完全贴住桌面</text></svg>