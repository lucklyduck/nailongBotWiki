<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a3"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><text x="450" y="34" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">扣上奶龙外壳，检查底部三个开孔</text><path d="M110 250 Q90 110 200 70 Q310 110 290 250 Z" fill="#fff3a6" stroke="#f7c600" stroke-width="3"/><rect x="170" y="180" width="60" height="48" rx="5" fill="#1d2330"/><circle cx="188" cy="200" r="4" fill="#7fd6ff"/><circle cx="212" cy="200" r="4" fill="#7fd6ff"/><path d="M150 210 q20 -20 25 0" fill="none" stroke="#f7c600" stroke-width="10" stroke-linecap="round"/><path d="M250 210 q-20 -20 -25 0" fill="none" stroke="#f7c600" stroke-width="10" stroke-linecap="round"/><line x1="200" y1="290" x2="200" y2="254" stroke="#8a93a3" stroke-width="2" marker-end="url(#arr)"/><rect x="130" y="290" width="140" height="40" rx="8" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2.5"/><text x="200" y="315" font-size="12" font-weight="400" fill="#2f8fe0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">机身底座</text><text x="200" y="360" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">外壳前侧压住电路板，屏幕从怀里露出</text><rect x="470" y="120" width="380" height="170" rx="20" fill="#e3f0fc" stroke="#2f8fe0" stroke-width="2.5"/><text x="660" y="105" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">从下往上看（屏幕朝上方）</text><rect x="500" y="190" width="40" height="22" rx="4" fill="#1d2330"/><rect x="640" y="250" width="40" height="16" rx="6" fill="#c9ccd1" stroke="#5b6472"/><circle cx="800" cy="200" r="12" fill="#e08c02"/><text x="520" y="240" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">电源开关</text><text x="520" y="258" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">（左侧）</text><text x="660" y="245" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Type-C</text><text x="800" y="235" font-size="13" font-weight="400" fill="#1d2330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">功能键</text><text x="800" y="253" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">（右侧）</text><text x="660" y="330" font-size="13" font-weight="400" fill="#d64545" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">三个开孔都不能被外壳挡住</text><text x="450" y="372" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">示意图，不是实拍。外壳固定方式待补充</text></svg>