<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiki 嵌入示例</title>
<style>body{margin:0;font:16px sans-serif}#hero{padding:70px 30px;background:#efbd50}button{padding:12px;cursor:pointer}iframe{display:block;width:100%;height:760px;border:0}#toolbar{padding:12px;background:#1b2422;color:#e5d2aa}#docs{padding:30px}</style>
<div id="hero"><h1>原有 Wiki 首页介绍</h1><button id="open">点一下试试</button></div>
<section id="game" hidden><div id="toolbar"><button id="close">返回 Wiki</button></div><div id="frame-slot"></div></section><section id="docs">原有文档内容放在这里</section>
<script>
const openButton=document.getElementById('open'),hero=document.getElementById('hero'),game=document.getElementById('game'),slot=document.getElementById('frame-slot');let frame;
function closeGame(){slot.replaceChildren();frame=null;game.hidden=true;hero.hidden=false;openButton.focus();}
openButton.onclick=()=>{hero.hidden=true;game.hidden=false;frame=document.createElement('iframe');frame.src='./games/naiwa-lab/index.html?embed=1';frame.title='奶蛙奇点实验室';slot.replaceChildren(frame);};
document.getElementById('close').onclick=closeGame;
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame?.contentWindow)return;if(event.data?.type==='naiwa-lab:resize'&&Number.isFinite(event.data.height))frame.style.height=Math.min(2400,Math.max(420,event.data.height))+'px';if(event.data?.type==='naiwa-lab:close')closeGame();});
</script></html>
